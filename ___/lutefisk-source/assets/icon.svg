<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lutefisk app icon: a pale, translucent fish bearing a capital L drawn as a fishing hook,
       with a pen-nib tail, on a deep fjord-blue tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5a86"/>
      <stop offset="1" stop-color="#0e2a47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.55" stop-color="#f3ecdc"/>
      <stop offset="1" stop-color="#ddd1b8"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6c453"/>
      <stop offset="1" stop-color="#d8962a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06182b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- gentle waves -->
  <path d="M120 792c70-34 140-34 210 0s140 34 210 0 140-34 210 0 140 34 154 20" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="18" stroke-linecap="round"/>
  <path d="M170 858c60-28 120-28 180 0s120 28 180 0 120-28 180 0 100 26 144 8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <!-- tail: a pen nib -->
    <path d="M664 512 L878 382 Q900 512 878 642 Z" fill="url(#nib)"/>
    <path d="M700 512 L860 512" stroke="#7a4a10" stroke-width="12" stroke-linecap="round"/>
    <circle cx="742" cy="512" r="17" fill="#7a4a10"/>
    <!-- body -->
    <path d="M150 512 C 210 370 360 300 520 306 C 610 310 670 360 712 430 C 728 456 728 568 712 594 C 670 664 610 714 520 718 C 360 724 210 654 150 512 Z" fill="url(#fish)"/>
    <!-- dorsal and belly fins -->
    <path d="M430 318 C 470 250 560 236 612 270 C 580 290 560 312 548 330 Z" fill="#e9dfc8"/>
    <path d="M470 706 C 500 760 560 772 600 750 C 576 734 560 716 552 698 Z" fill="#e9dfc8"/>
    <!-- gill -->
    <path d="M318 400 C 350 450 350 574 318 624" fill="none" stroke="#c9b994" stroke-width="14" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="246" cy="482" r="26" fill="#13324f"/>
    <circle cx="255" cy="473" r="8" fill="#ffffff"/>
    <!-- the Lutefisk "L", drawn as a fishing hook: eye, shank, bend, point and barb -->
    <g fill="none" stroke="#2b5a86" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="468" cy="372" r="22" stroke-width="16"/>
      <path d="M468 394 V 586 Q 468 642 524 642 H 572 Q 618 642 626 596" stroke-width="38"/>
    </g>
    <!-- point and barb -->
    <path d="M607 600 L 629 532 L 645 600 Z" fill="#2b5a86"/>
    <path d="M612 578 L 584 616 L 611 606 Z" fill="#2b5a86"/>
  </g>
</svg>
